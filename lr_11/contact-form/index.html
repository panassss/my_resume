<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get in touch — Contact Form</title>

    <link rel="stylesheet" href="style/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="page">
      <div class="card">
        <!-- Ліва (темна) частина — форма -->
        <section class="form-side">
          <h1>Get in touch</h1>
          <span class="underline"></span>

          <form class="contact-form" novalidate>
            <div class="field">
              <input type="text" id="name" name="name" placeholder="Name" required />
            </div>
            <div class="field">
              <input type="email" id="email" name="email" placeholder="Email" required />
            </div>
            <div class="field">
              <textarea id="message" name="message" placeholder="Message"></textarea>
            </div>

            <label class="checkbox" for="news">
              <input type="checkbox" id="news" name="news" />
              <span>I would like to receive the newsletter.</span>
            </label>

            <button type="submit">Submit</button>
          </form>
        </section>

        <!-- Права (біла) частина — інформація -->
        <aside class="info-side">
          <p class="intro">
            Borem ipsum dolor sit amet, consectetur adipiscing elit. Nunc
            vulputate libero et velit interdum, ac aliquet odio mattis.
          </p>

          <div class="map-card">
            <img class="map-bg" src="img/map.png" alt="Map" />
            <div class="map-label">
              <span class="company">Company name</span>
              <span>315 W 36th St.</span>
              <span>NY 10018</span>
            </div>
          </div>

          <ul class="contact-info">
            <li><img src="img/location.svg" alt="" /> NYC, United States</li>
            <li><img src="img/phone.svg" alt="" /> 000111222333</li>
            <li><img src="img/email.svg" alt="" /> somebody@gmail.com</li>
          </ul>

          <div class="socials">
            <img src="img/social.svg" alt="Social media" />
          </div>
        </aside>
      </div>
    </main>
  </body>
</html>
