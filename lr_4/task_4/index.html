<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Task 4</title>
    <style>
        .power {
            margin: 20px;
            width: 175px;
            height: 50px;
            border: 3px solid black;
            position: relative;
        }

        .power::after {
            content: "";
            position: absolute;
            top: 15px;
            left: 178px;
            width: 10px;
            height: 20px;
            background-color: black;
        }

        .power::before {
            display: inline-block;
            content: "";
            position: absolute;
        }

        .red::before {
            background-color: red;
            width: 25%;
            height: 100%;
        }

        .yellow::before {
            background-color: yellow;
            width: 65%;
            height: 100%;
        }

        .green::before {
            background-color: green;
            width: 100%;
            height: 100%;
        }
    </style>

</head>

<body>
    <div class="power red"></div>
    <div class="power yellow"></div>
    <div class="power green"></div>
</body>

</html>
