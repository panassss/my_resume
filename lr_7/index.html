<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зброя</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>оберіть свою зброю</h1>

    <div class="wrap">

        <div class="swipe swipe_left">&lt;</div>

        <div class="card card_pistol">

            <div class="bage bage_pistol">новинка</div>

            <div class="category">
                <a href="https://stvol.ua/catalog/pistoleti-ta-revolveri/c433" target="_blank">пістолети</a>
            </div>

            <hr>

            <div class="image">
                <a href="img/Carl Walther.jpg">
                    <img src="img/Carl Walther.jpg" alt="Фото пістолета">
                </a>
            </div>

            <div class="name">
                <a href="https://stvol.ua/catalog/pistolet-sportivniy-carl-walther-q5-match-sf-the-patriot-9h19/p938315343" target="_blank">Carl Walther</a>
            </div>

            <div class="price">345 454.00 грн</div>

            <div class="btn soon">незабаром у продажі</div>

        </div>

        <div class="card card_rifle">

            <div class="category">
                <a href="https://stvol.ua/catalog/zbroya/c238" target="_blank">гвинтівки</a>
            </div>

            <hr>

            <div class="image">
                <a href="img/Barrett MRAD.jpg">
                    <img src="img/Barrett MRAD.jpg" alt="Фото гвинтівки">
                </a>
            </div>

            <div class="name">
                <a href="https://stvol.ua/catalog/18480-karabin-narizniy-barrett-mrad-kal-338lm-26-gray/p775592254" target="_blank">Barrett MRAD</a>
            </div>

            <div class="price">
                <s>515 000.00 грн</s> 504 000.00 грн
            </div>

            <div class="btn">у корзину</div>

        </div>

        <div class="card card_sniper">

            <div class="bage bage_sniper">хіт продажів</div>

            <div class="category">
                <a href="https://stvol.ua/catalog/pnevmatichni-gvintivki/c455" target="_blank">снайперки</a>
            </div>

            <hr>

            <div class="image">
                <a href="img/GAMO HPA Mi.jpg">
                    <img src="img/GAMO HPA Mi.jpg" alt="Фото снайперської гвинтівки">
                </a>
            </div>

            <div class="name">
                <a href="https://stvol.ua/catalog/pnevmatichna-gvintivka-gamo-hpa-mi-pricil-3-9h40/p6915" target="_blank">GAMO HPA Mi</a>
            </div>

            <div class="price">18 815.00 грн</div>

            <div class="btn">у корзину</div>

        </div>

        <div class="card card_shotgun">

            <div class="bage bage_shotgun">хіт продажів</div>

            <div class="category">
                <a href="https://stvol.ua/catalog/pompova-zbroya/c456" target="_blank">дробовики</a>
            </div>

            <hr>

            <div class="image">
                <a href="img/Mossberg M590.jpg">
                    <img src="img/Mossberg M590.jpg" alt="Фото дробовика">
                </a>
            </div>

            <div class="name">
                <a href="https://stvol.ua/catalog/rushnicya-mislivska-mossberg-m590-kal-12-18-5-parkerized-synthetic/p5037" target="_blank">Mossberg M590</a>
            </div>

            <div class="price">
                <s>45 500.00 грн</s> 40 500.00 грн
            </div>

            <div class="btn">у корзину</div>

        </div>

        <div class="swipe swipe_right">&gt;</div>

    </div>

</body>

</html>
